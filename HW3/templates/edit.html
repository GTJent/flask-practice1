{% extends "base.html" %}

{% block title %}Edit Todo - Todo App{% endblock %}

{% block content %}
<h2>Edit Todo</h2>
<form method="post">
    <input type="text" name="todo" value="{{ todo.text }}" required>
    <input type="text" name="note" value="{{ todo.note }}" placeholder="설명">
    <button type="submit">저장</button>
</form>
<a href="{{ url_for('index') }}">목록으로</a>
{% endblock %}
